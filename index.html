<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="자막 없이">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>자막 없이 일본어</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-jp-dynamic-subset.min.css">
<style>
/* Layout: archive-style index. Thin sticky header with centered mark, hairline rules that run edge to edge,
   11px uppercase labels with [bracket] counts, one oversized tight display word per screen. */
:root{
  --bg:#fff; --fg:#111; --muted:#8a8a8a; --line:#e4e4e4; --soft:#f4f4f2;
  --good:#1f7a4d; --good-soft:#edf5f0; --bad:#c0392b; --bad-soft:#fbeeec;
  --font:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Helvetica Neue",sans-serif;
  --font-jp:"Pretendard JP Variable","Pretendard JP","Hiragino Sans","Noto Sans JP",var(--font);
  --label:600 11px/1.2 var(--font);
  --head:44px;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111; --fg:#f2f2f0; --muted:#8a8a8a; --line:#2a2a2a; --soft:#1b1b1b;
    --good:#6cc79a; --good-soft:#15241c; --bad:#ef7a6c; --bad-soft:#2a1714;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111; --fg:#f2f2f0; --muted:#8a8a8a; --line:#2a2a2a; --soft:#1b1b1b;
  --good:#6cc79a; --good-soft:#15241c; --bad:#ef7a6c; --bad-soft:#2a1714;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.6;letter-spacing:-.005em;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;letter-spacing:inherit}
button:focus-visible,input:focus-visible{outline:1px solid var(--fg);outline-offset:3px}
[lang="ja"]{font-family:var(--font-jp)}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.lbl{font:var(--label);letter-spacing:.02em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{height:var(--head);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;padding-left:var(--gl);padding-right:var(--gr)}
.top-in > :last-child{justify-self:end}
.logo{display:inline-flex;align-items:center;gap:8px}
.logo b{font-size:12px;font-weight:700;letter-spacing:.14em}
.mark{width:22px;height:22px;border:1px solid currentColor;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;line-height:1}
#slowBtn{color:var(--muted)}
#slowBtn.on{color:var(--fg)}

/* page column: children get the gutter, .bleed rows run edge to edge */
main{max-width:720px;margin:0 auto;padding-block:0 calc(72px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:20px}
main > *{margin-left:var(--gl);margin-right:var(--gr)}
main > .bleed,main > .chips,main > .list{margin-left:0;margin-right:0}
main > :first-child:not(.bleed){margin-top:20px}
main > .chips:first-child,main > .toolbar:first-child{margin-top:16px}
.bleed{border-top:1px solid var(--line)}
.row-h{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px;padding:10px var(--gr) 10px var(--gl);border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;padding:14px var(--gr) 14px var(--gl);border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.arrow::after{content:" ↗"}

/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);padding-left:var(--gl);padding-right:var(--gr)}
.tab{height:52px;display:flex;align-items:center;justify-content:center;color:var(--muted);position:relative}
.tab.on{color:var(--fg)}
.tab.on::before{content:"";position:absolute;top:-1px;left:22%;right:22%;height:2px;background:var(--fg)}

/* home: hero */
.hero{display:flex;flex-direction:column;gap:14px;padding-block:28px 8px}
.hero h1{font-size:clamp(64px,22vw,140px);font-weight:700;line-height:.95;letter-spacing:-.06em;margin-left:-.04em}
.thesis{font-size:16px;line-height:1.75;max-width:34em}
.thesis u{text-decoration:underline dotted;text-decoration-color:var(--muted);text-underline-offset:4px}

/* levels */
.levels{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.lv{display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px 12px 14px var(--gl);border-left:1px solid var(--line);min-width:0;color:var(--muted)}
.lv:first-child{border-left:0}
.lv + .lv{padding-left:12px}
.lv b{font-size:15px;font-weight:600;line-height:1.3;color:inherit}
.lv.on{color:var(--fg);background:var(--soft)}

/* progress */
.progress{display:flex;flex-direction:column;gap:12px;padding:16px var(--gr) 18px var(--gl)}
.meter{height:2px;background:var(--line)}
.meter i{display:block;height:100%;background:var(--fg)}
.progress .big{font-size:44px;font-weight:700;letter-spacing:-.05em;line-height:1;font-variant-numeric:tabular-nums}
.progress .big span{font-size:18px;letter-spacing:-.02em;color:var(--muted);font-weight:600;margin-left:4px}
.progress p{font-size:14px;color:var(--muted)}
.link-up{align-self:flex-start;color:var(--fg)}

/* today */
.today-row{padding-block:12px}
.t-main{display:flex;flex-direction:column;gap:2px;text-align:left;min-width:0;flex:1}
.t-jp{font-size:21px;font-weight:700;letter-spacing:-.02em;line-height:1.35}
.t-sub{font-size:13px;color:var(--muted)}

/* situations */
.cat-row{align-items:flex-start}
.cat-name{display:flex;flex-direction:column;gap:2px;min-width:0}
.cat-name b{font-size:15px;font-weight:600}
.cat-name small{font-size:13px;color:var(--muted)}
.cat-row .lbl{padding-top:4px;white-space:nowrap}
.cat-row.done .cat-name b::after{content:" ✓";color:var(--good)}

/* notes */
.notes ol{margin:0;padding:6px var(--gr) 4px var(--gl);list-style:none;counter-reset:n}
.notes li{counter-increment:n;display:grid;grid-template-columns:28px 1fr;padding-block:12px;border-bottom:1px solid var(--line);font-size:14px;color:var(--muted)}
.notes li:last-child{border-bottom:0}
.notes li::before{content:counter(n,decimal-leading-zero);font:var(--label);color:var(--fg);padding-top:4px}
.notes b{color:var(--fg);font-weight:600}

.foot{display:flex;justify-content:space-between;gap:12px;padding:16px var(--gr) 8px var(--gl)}

/* chips */
.chips{display:flex;gap:0;overflow-x:auto;overflow-y:hidden;min-width:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding-left:var(--gl);padding-right:var(--gr);scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x pan-y;overscroll-behavior-x:contain;cursor:grab}
.chips::-webkit-scrollbar{display:none}
.chips.dragging{cursor:grabbing;user-select:none}
.chips.dragging .chip{pointer-events:none}
@media (hover:hover) and (pointer:fine){
  .chips{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
  .chips::-webkit-scrollbar{display:block;height:4px}
  .chips::-webkit-scrollbar-thumb{background:var(--line)}
}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;padding:12px 14px 11px 0;margin-right:14px;font-size:13px;font-weight:600;white-space:nowrap;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px}
.chip .n{font:var(--label);color:var(--muted)}
.chip .n::before{content:"["}
.chip .n::after{content:"]"}
.chip.on{color:var(--fg);border-bottom-color:var(--fg)}

.toolbar{display:flex;gap:12px;align-items:center}
.search{flex:1;min-width:0;padding:10px 0;border:0;border-bottom:1px solid var(--fg);border-radius:0;background:transparent;color:var(--fg);font:inherit;font-size:15px}
.search:focus-visible{outline:0;border-bottom-width:2px}
.search::placeholder{color:var(--muted)}
.pill{font:var(--label);letter-spacing:.02em;color:var(--muted);white-space:nowrap;padding:8px 0}
.pill.on{color:var(--fg);text-decoration:underline;text-underline-offset:4px}

/* word entries */
.list{display:flex;flex-direction:column}
.card{display:flex;flex-direction:column;gap:8px;padding:18px var(--gr) 20px var(--gl);border-bottom:1px solid var(--line)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:-4px}
.tag{font:var(--label);letter-spacing:.02em;color:var(--muted)}
.tools{display:flex;gap:2px;margin-right:-8px}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;color:var(--muted)}
.icon-btn svg{width:18px;height:18px;stroke-width:1.6}
.icon-btn.on{color:var(--fg)}
.icon-btn.on .star{fill:currentColor}
.icon-btn.learn.on svg{background:var(--fg);color:var(--bg);padding:2px}
.jp{display:inline-flex;align-items:center;gap:10px;text-align:left;font-size:28px;font-weight:700;letter-spacing:-.03em;line-height:1.3;align-self:flex-start}
.jp svg{width:18px;height:18px;color:var(--muted);flex:0 0 auto;stroke-width:1.6}
.read{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:14px;color:var(--muted)}
.read .kana{color:var(--fg);text-decoration:underline dotted;text-decoration-color:var(--muted);text-underline-offset:4px}
.mean{font-size:16px;font-weight:600}
.note{font-size:14px;color:var(--muted)}
.ex{display:flex;flex-direction:column;gap:2px;padding:12px 14px;background:var(--soft)}
.ex-jp{display:flex;gap:8px;align-items:flex-start;text-align:left;font-size:15px;font-weight:500}
.ex-jp svg{width:15px;height:15px;margin-top:5px;color:var(--muted);flex:0 0 auto;stroke-width:1.6}
.ex-ko{font-size:13px;color:var(--muted);padding-left:23px}
.hideable{display:flex;flex-direction:column;gap:8px;transition:filter .2s}
.hide-mean .card:not(.reveal) .hideable{filter:blur(7px);cursor:pointer;user-select:none}
.empty{padding:32px 20px;text-align:center;color:var(--muted);background:var(--soft);display:flex;flex-direction:column;gap:14px;align-items:center}
.empty b{color:var(--fg)!important}

/* flashcards */
.deck-meta{display:flex;justify-content:space-between;gap:12px;font:var(--label);letter-spacing:.02em;color:var(--muted);text-transform:uppercase;font-variant-numeric:tabular-nums}
.flash{min-height:340px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:32px 20px;border:1px solid var(--line);cursor:pointer}
.flash .jp{font-size:48px;letter-spacing:-.04em;align-self:center}
.flash .read{justify-content:center;font-size:15px}
.flash .hint{font:var(--label);letter-spacing:.02em;color:var(--muted)}
.flash .mean{font-size:19px}
.flash .ex{text-align:left;width:100%}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{min-height:50px;padding:12px 16px;font-weight:700;font-size:14px;border:1px solid var(--fg);text-align:center}
.btn.primary,.btn.good{background:var(--fg);color:var(--bg)}
.btn.small{min-height:40px;padding:8px 16px;font-size:13px}
.link-btn{align-self:center;padding:8px 0;font:var(--label);letter-spacing:.02em;color:var(--muted);text-decoration:underline;text-underline-offset:4px}

/* quiz */
.sec-title{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.sec-title h2,.sec-title span{font:var(--label);letter-spacing:.02em;text-transform:uppercase}
.sec-title span{color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--fg)}
.seg button{padding:12px 6px;font-size:13px;font-weight:600;color:var(--fg);border-left:1px solid var(--fg)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--fg);color:var(--bg)}
.q-card{display:flex;flex-direction:column;align-items:center;gap:12px;padding:36px 18px;border:1px solid var(--line);text-align:center}
.q-card .jp{font-size:40px;letter-spacing:-.04em;align-self:center}
.q-card .q-ko{font-size:24px;font-weight:700;letter-spacing:-.03em}
.listen-btn{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;background:var(--fg);color:var(--bg)}
.listen-btn svg{width:34px;height:34px;stroke-width:1.6}
.opts{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.opt{text-align:left;padding:15px 4px;border-bottom:1px solid var(--line);font-size:15px;display:flex;justify-content:space-between;gap:12px}
.opt.jp-opt{font-family:var(--font-jp);font-size:19px;font-weight:700;letter-spacing:-.02em}
.opt.right{background:var(--good-soft);color:var(--good);font-weight:700;padding-inline:12px}
.opt.right::after{content:"✓"}
.opt.wrong{background:var(--bad-soft);color:var(--bad);padding-inline:12px}
.opt.wrong::after{content:"✕"}
.opt:disabled{cursor:default}
.feedback{display:flex;flex-direction:column;gap:6px;padding:16px;background:var(--soft)}
.feedback .fb-jp{font-family:var(--font-jp);font-size:22px;font-weight:700;letter-spacing:-.02em}
.score{font-size:96px;font-weight:700;letter-spacing:-.06em;font-variant-numeric:tabular-nums;line-height:.9}
.eyebrow{font:var(--label);letter-spacing:.02em;color:var(--muted);text-transform:uppercase}

.toast{position:fixed;left:50%;bottom:calc(68px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;font-size:13px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

<style>
/* 기본 리셋: 노치·홈 바 영역 피하기 */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <span class="lbl" id="levelLabel">LV.1</span>
    <button class="logo" data-nav="home" aria-label="홈으로"><span class="mark" lang="ja">あ</span><b>JIMAKU NASHI</b></button>
    <button class="lbl" id="slowBtn" data-slow aria-pressed="false">Normal</button>
  </div>
</header>
<main id="view"></main>
<nav class="tabs" aria-label="메뉴">
  <div class="tabs-in" id="tabs"></div>
</nav>
<div class="toast" id="toast" hidden></div>

<script>
const I = {
  speaker:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>',
  star:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path class="star" d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>',
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/></svg>',
  book:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5V5a2 2 0 0 1 2-2h14v15H6a2 2 0 0 0-2 2 2 2 0 0 0 2 2h14"/></svg>',
  cards:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="13" height="14" rx="2"/><path d="M8 3h11a2 2 0 0 1 2 2v12"/></svg>',
  quiz:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7"/><path d="M12 17h.01"/></svg>'
};

const LEVELS = [
  {n:1, jp:'基礎', name:'기초', desc:'짧은 리액션, 인사, 기분 표현'},
  {n:2, jp:'会話', name:'일상 회화', desc:'멤버끼리 반말, 게임, 팬 멘트, 말끝'},
  {n:3, jp:'実戦', name:'실전 듣기', desc:'축약, 요즘 말, 사투리, 존댓말, 긴 문장'}
];
const CATS = [
  {id:'react', lv:1, name:'리액션·맞장구', desc:'영상에서 제일 많이 들리는 짧은 반응'},
  {id:'greet', lv:1, name:'인사·기본', desc:'촬영 현장에서 꼭 쓰는 인사'},
  {id:'feel', lv:1, name:'감정·상태', desc:'졸려, 배고파, 긴장돼'},
  {id:'food', lv:1, name:'먹방·음식', desc:'맛 표현과 식사 자리 말'},
  {id:'talk', lv:2, name:'멤버끼리 대화', desc:'숙소·대기실 브이로그 속 반말'},
  {id:'game', lv:2, name:'게임·예능', desc:'자컨 게임, 벌칙, 정답 발표'},
  {id:'fan', lv:2, name:'팬과 소통', desc:'라이브 방송·팬미팅 멘트'},
  {id:'ending', lv:2, name:'말끝 표현', desc:'ね・よ・かな, 문장 끝 뉘앙스'},
  {id:'casual', lv:3, name:'구어 축약', desc:'교과서와 다르게 들리는 진짜 말투'},
  {id:'slang', lv:3, name:'요즘 말·덕질', desc:'推し, 尊い, ガチ 같은 유행어'},
  {id:'kansai', lv:3, name:'간사이 사투리', desc:'오사카·교토 쪽 말투'},
  {id:'keigo', lv:3, name:'스태프와 존댓말', desc:'촬영장에서 쓰는 정중한 말'},
  {id:'long', lv:3, name:'긴 문장 듣기', desc:'여러 표현이 이어지는 실제 속도 문장'}
];

// [일본어, 읽기(가나), 한글 발음, 뜻, 메모, 예문, 예문 해석]
const RAW = {
react:[

function mulberry(seed){ return () => { seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  try { localStorage.setItem(KEY, JSON.stringify({view:S.view, cat:S.cat, hide:S.hide, slow:S.slow, learned:[...S.learned], fav:[...S.fav], quizMode:S.quizMode, level:S.level})); } catch (e) {}
}

/* 음성 */
let jaVoice = null;
function pickVoice(){
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  jaVoice = vs.find(v => /^ja[-_]JP/i.test(v.lang) && /Kyoko|O-ren|Google/i.test(v.name)) || vs.find(v => /^ja/i.test(v.lang)) || null;
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
// 한자는 음성 엔진이 잘못 읽을 수 있어서, 읽기(가나)가 있으면 가나로 읽힌다
const sayOf = it => (it.r && !it.r.includes('→')) ? it.r : it.j;
// 예문 속 헷갈리기 쉬운 한자 읽기
const READ_FIX = [['辛っ','からっ'],['熱っ','あつっ'],['明日','あした'],['今日','きょう'],['何だっけ','なんだっけ'],['何これ','なにこれ'],['一口','ひとくち'],['二人','ふたり'],['上手','じょうず'],['良すぎ','よすぎ']];
function cleanForVoice(text){
  let s = text;
  for (const [a, b] of READ_FIX) s = s.split(a).join(b);
  return s
    .replace(/^〜/, '')                    // 패턴 표시(〜てる)의 앞 물결은 읽지 않음
    .replace(/〜/g, 'ー')                  // 말끝 물결은 길게 늘이기
    .replace(/―/g, '')
    .replace(/\s*\/\s*/g, '。')            // A / B 는 끊어서
    .replace(/っ(?=[。、]|$)/g, "っ!"); // 끝의 작은 っ가 잘리지 않게
}
// 음성 파일 이름: 읽을 문장의 해시 (FNV-1a)
function voiceKey(text){
  let h = 0x811c9dc5;
  for (const ch of cleanForVoice(text)) { h ^= ch.codePointAt(0); h = Math.imul(h, 0x01000193) >>> 0; }
  return h.toString(36);
}
let lastSay = {text: '', at: 0};
let player = null;
function speak(text){
  const now = Date.now();
  const repeat = lastSay.text === text && now - lastSay.at < 6000;
  lastSay = {text, at: now};
  // 같은 걸 바로 다시 누르면 천천히
  const rate = repeat ? 0.7 : S.slow ? 0.8 : 1;
  if (repeat && !S.slow) toast('천천히 한 번 더');
  if (player) { player.pause(); player.onerror = null; }
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  const p = new Audio('a/' + voiceKey(text) + '.mp3');
  player = p;
  p.preservesPitch = true;
  p.playbackRate = rate;
  let failed = false;
  const fail = () => { if (failed || player !== p) return; failed = true; speakTTS(text, rate); };
  p.onerror = fail;
  const pr = p.play();
  if (pr && pr.catch) pr.catch(err => { if (err && err.name !== 'AbortError') fail(); });
}
// 녹음 파일이 없을 때만 기기 음성으로
function speakTTS(text, rate){
  if (!('speechSynthesis' in window)) { toast('음성을 재생하지 못했어요'); return; }
  if (!jaVoice) pickVoice();
  if (!jaVoice) { toast('이 표현은 녹음 파일이 없고, 기기에 일본어 음성도 없어요'); return; }
  const u = new SpeechSynthesisUtterance(cleanForVoice(text));
  u.lang = 'ja-JP'; u.voice = jaVoice; u.rate = rate * 0.9;
  speechSynthesis.speak(u);
}

let toastTimer;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 1800);
}

function pool(cat){

}

function levelStats(n){

// 날짜별로 순서를 섞고, 아직 안 외운 것 중 앞 5개

/* 화면: 퀴즈 */
const MODES = {jp2ko:'일본어 → 뜻', listen:'듣고 뜻 고르기', ko2jp:'뜻 → 일본어'};
function startQuiz(){
  const p = pool(S.cat);
  if (p.length < 4) { toast('퀴즈는 표현이 4개 이상 있어야 해요'); return false; }
  const key = S.quizMode === 'ko2jp' ? 'j' : 'm';
  const qs = shuffle(p).slice(0, 10).map(it => {
    const src = shuffle(p.length >= 8 ? p : ITEMS);
    const others = [];
    for (const o of src) {
      if (o.id === it.id || o[key] === it[key] || others.some(x => x[key] === o[key])) continue;
      others.push(o); if (others.length === 3) break;
    }
    return {id: it.id, opts: shuffle([it, ...others]).map(o => o.id)};
  });
  S.quiz = {mode: S.quizMode, qs, i: 0, score: 0, picked: null, wrong: [], done: false};
  return true;
}
function viewQuiz(){
  const Q = S.quiz;
  if (!Q) {
    return `
    <section style="display:flex;flex-direction:column;gap:10px">
      <div class="sec-title"><h2>퀴즈 방식</h2><span>10문제</span></div>
      <div class="seg">${Object.entries(MODES).map(([k, v]) => `<button class="${S.quizMode === k ? 'on' : ''}" data-mode="${k}">${v}</button>`).join('')}</div>
      <p class="muted">${S.quizMode === 'listen' ? '글자 없이 소리만 듣고 고르는 모드예요. 자막 없이 듣는 연습에 제일 가까워요.' : S.quizMode === 'ko2jp' ? '한국어 뜻을 보고 맞는 일본어를 골라요.' : '일본어를 보고 맞는 뜻을 골라요.'}</p>
    </section>
    <section style="display:flex;flex-direction:column;gap:10px">
      <div class="sec-title"><h2>범위</h2><span>${S.level}단계</span></div>
      ${chips()}
    </section>
    <button class="btn primary" data-start>퀴즈 시작</button>`;
  }
  if (Q.done) {
    const n = Q.qs.length;
    return `
    <section class="q-card">
      <span class="eyebrow">${esc(MODES[Q.mode])}</span>
      <div class="score">${Q.score}<span style="font-size:20px;color:var(--muted)"> / ${n}</span></div>
      <p class="muted">${Q.score === n ? '완벽해요!' : Q.score >= Math.ceil(n * 0.8) && S.level < LEVELS.length ? '이 단계는 충분히 들려요. 다음 단계에 도전해 보세요.' : Q.score >= n * 0.7 ? '거의 다 들려요.' : '틀린 표현을 단어장에서 한 번 더 보세요.'}</p>
    </section>
    ${Q.wrong.length ? `<div class="sec-title"><h2>틀린 표현</h2><button class="pill" data-fav-wrong>모두 즐겨찾기</button></div>
    <div class="list">${Q.wrong.map(id => cardHTML(byId[id])).join('')}</div>` : ''}
    ${Q.score >= Math.ceil(n * 0.8) && S.level < LEVELS.length && S.cat !== 'fav' ? `<button class="btn primary" data-level-quiz="${S.level + 1}">${S.level + 1}단계 퀴즈 도전</button>` : ''}
    <div class="btn-row"><button class="btn" data-quiz-home>방식 바꾸기</button><button class="btn primary" data-start>다시 풀기</button></div>`;
  }
  const q = Q.qs[Q.i], it = byId[q.id], answered = Q.picked !== null;
  const prompt = Q.mode === 'listen'
    ? `<button class="listen-btn" data-say="${esc(sayOf(it))}" aria-label="다시 듣기">${I.speaker}</button><p class="muted">눌러서 다시 듣기 · 한 번 더 누르면 천천히</p>`
    : Q.mode === 'ko2jp'
      ? `<p class="q-ko">${esc(it.m)}</p>`
      : `<button class="jp" data-say="${esc(sayOf(it))}"><span lang="ja">${esc(it.j)}</span>${I.speaker}</button>`;
  return `
  <div class="deck-meta"><span>${esc(MODES[Q.mode])}</span><span>${Q.i + 1} / ${Q.qs.length} · 맞힌 개수 ${Q.score}</span></div>
  <section class="q-card">${prompt}</section>
  <div class="opts">${q.opts.map((oid, idx) => {
    const o = byId[oid];
    let cls = 'opt' + (Q.mode === 'ko2jp' ? ' jp-opt' : '');
    if (answered && oid === q.id) cls += ' right';
    else if (answered && idx === Q.picked) cls += ' wrong';
    return `<button class="${cls}" data-ans="${idx}" ${answered ? 'disabled' : ''}${Q.mode === 'ko2jp' ? ' lang="ja"' : ''}>${esc(Q.mode === 'ko2jp' ? o.j : o.m)}</button>`;

  </div>
  <button class="btn primary" data-next>${Q.i + 1 < Q.qs.length ? '다음 문제' : '결과 보기'}</button>` : ''}`;
}

/* 렌더 */
const TABS = [['home', 'Home', '홈'], ['list', 'Words', '단어장'], ['cards', 'Cards', '카드'], ['quiz', 'Quiz', '퀴즈']];
function render(){
  const v = document.getElementById('view');
  v.innerHTML = S.view === 'list' ? viewList() : S.view === 'cards' ? viewCards() : S.view === 'quiz' ? viewQuiz() : viewHome();
  document.getElementById('tabs').innerHTML = TABS.map(([id, label, ko]) => `<button class="tab lbl${S.view === id ? ' on' : ''}" data-nav="${id}" aria-label="${ko}" aria-current="${S.view === id ? 'page' : 'false'}">${label}</button>`).join('');
  document.getElementById('levelLabel').textContent = `Lv.${S.level} ${LEVELS[S.level - 1].name}`;
  const sb = document.getElementById('slowBtn');
  sb.textContent = S.slow ? 'Slow' : 'Normal';
  sb.classList.toggle('on', S.slow);
  sb.setAttribute('aria-pressed', S.slow);
  const on = v.querySelector('.chip.on');
  if (on) { const c = on.parentElement; c.scrollLeft = on.offsetLeft - c.offsetLeft - (c.clientWidth - on.offsetWidth) / 2; }
  persist();
}
function go(view){ S.view = view; render(); window.scrollTo(0, 0); }

document.addEventListener('click', e => {
  const t = e.target.closest('button,[data-flip],[data-reveal]');
  if (!t) return;
  const list = t.closest('.hide-mean');
  const card = t.closest('.card');
  if (list && card && !card.classList.contains('reveal') && t.closest('[data-reveal]')) { card.classList.add('reveal'); return; }
  const ds = t.dataset;
  if (ds.say !== undefined) { speak(ds.say); return; }
  if (ds.nav) { go(ds.nav); return; }
  if (ds.slow !== undefined) { S.slow = !S.slow; render(); toast(S.slow ? '음성을 천천히 읽어요' : '음성을 보통 속도로 읽어요'); return; }
  if (ds.cat) { S.cat = ds.cat; S.deck = null; S.skipAsk = false; render(); return; }
  if (ds.goCat) { S.level = CATS.find(c => c.id === ds.goCat).lv; S.cat = ds.goCat; S.deck = null; go('list'); return; }
  if (ds.level) { const n = +ds.level; if (n !== S.level) setLevel(n); render(); if (S.view === 'home') window.scrollTo(0, 0); return; }
  if (ds.learnToday) { S.learned.add(ds.learnToday); render(); return; }
  if (ds.knowToday !== undefined) { todayPicks().forEach(i => S.learned.add(i.id)); render(); toast('다음 표현을 가져왔어요'); return; }
  if (ds.skipAsk !== undefined) { S.skipAsk = true; render(); return; }
  if (ds.skipCancel !== undefined) { S.skipAsk = false; render(); return; }
  if (ds.skipGo !== undefined) {
    const moveOn = S.cat === 'all' && S.level < LEVELS.length;
    S.deck.queue.forEach(id => S.learned.add(id));
    S.skipAsk = false; S.deck = null;
    if (moveOn) setLevel(S.level + 1);
    render(); window.scrollTo(0, 0); return;
  }
  if (ds.levelQuiz) { setLevel(+ds.levelQuiz); if (startQuiz()) { render(); window.scrollTo(0, 0); if (S.quiz.mode === 'listen') speak(sayOf(byId[S.quiz.qs[0].id])); } return; }
  if (ds.hide !== undefined) { S.hide = !S.hide; render(); return; }
  if (ds.fav) { S.fav.has(ds.fav) ? S.fav.delete(ds.fav) : S.fav.add(ds.fav); updateCardButtons(t, S.fav.has(ds.fav)); persist(); return; }
  if (ds.learn) { S.learned.has(ds.learn) ? S.learned.delete(ds.learn) : S.learned.add(ds.learn); const on = S.learned.has(ds.learn); updateCardButtons(t, on); t.closest('.card')?.classList.toggle('done', on); persist(); return; }
  if (ds.flip !== undefined) { S.deck.flipped = !S.deck.flipped; render(); return; }
  if (ds.again !== undefined) { const D = S.deck; const id = D.queue.shift(); D.queue.splice(Math.min(3, D.queue.length), 0, id); D.flipped = false; render(); return; }
  if (ds.got !== undefined) { const D = S.deck; S.learned.add(D.queue.shift()); D.done++; D.flipped = false; render(); return; }
  if (ds.resetCat !== undefined) { pool(S.cat).forEach(i => S.learned.delete(i.id)); S.deck = null; render(); toast('처음부터 다시 시작해요'); return; }
  if (ds.mode) { S.quizMode = ds.mode; render(); return; }
  if (ds.start !== undefined) { if (startQuiz()) { render(); window.scrollTo(0, 0); if (S.quiz.mode === 'listen') speak(sayOf(byId[S.quiz.qs[0].id])); } return; }
  if (ds.ans !== undefined) {
    const Q = S.quiz, q = Q.qs[Q.i], idx = +ds.ans;
    Q.picked = idx;
    if (q.opts[idx] === q.id) Q.score++; else Q.wrong.push(q.id);
    render(); speak(sayOf(byId[q.id])); return;
  }
  if (ds.next !== undefined) {
    const Q = S.quiz;
    Q.picked = null;
    if (Q.i + 1 < Q.qs.length) { Q.i++; render(); if (Q.mode === 'listen') speak(sayOf(byId[Q.qs[Q.i].id])); }
    else { Q.done = true; render(); }
    window.scrollTo(0, 0); return;
  }
  if (ds.quizHome !== undefined) { S.quiz = null; render(); return; }
  if (ds.favWrong !== undefined) { S.quiz.wrong.forEach(id => S.fav.add(id)); render(); toast('즐겨찾기에 담았어요'); return; }
});
function updateCardButtons(btn, on){ btn.classList.toggle('on', on); btn.setAttribute('aria-pressed', on); }

// 칩 줄: 세로 휠을 가로 스크롤로, 마우스로 끌어서 넘기기
document.addEventListener('wheel', e => {
  const c = e.target.closest('.chips');
  if (!c || c.scrollWidth <= c.clientWidth || Math.abs(e.deltaX) > Math.abs(e.deltaY)) return;
  e.preventDefault();
  c.scrollLeft += e.deltaY;
}, {passive: false});
let drag = null;
document.addEventListener('pointerdown', e => {
  const c = e.target.closest('.chips');
  if (!c || e.pointerType !== 'mouse' || e.button !== 0) return;
  drag = {c, x: e.clientX, left: c.scrollLeft, moved: false};
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x;
  if (!drag.moved && Math.abs(dx) > 5) { drag.moved = true; drag.c.classList.add('dragging'); }
  if (drag.moved) drag.c.scrollLeft = drag.left - dx;
});
document.addEventListener('pointerup', () => {
  if (!drag) return;
  const d = drag; drag = null;
  if (d.moved) {
    // 끌기가 끝난 직후의 클릭은 칩 선택으로 치지 않음
    const stop = ev => { ev.stopPropagation(); ev.preventDefault(); };
    document.addEventListener('click', stop, {capture: true, once: true});
    setTimeout(() => { document.removeEventListener('click', stop, {capture: true}); d.c.classList.remove('dragging'); }, 0);
  }
});

document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[data-flip]')) { e.preventDefault(); S.deck.flipped = !S.deck.flipped; render(); }
});
document.addEventListener('input', e => {
  if (e.target.id !== 'search') return;
  S.q = e.target.value;
  // 입력창은 그대로 두고 목록만 다시 그려서 한글 조합이 끊기지 않게
  const tmp = document.createElement('div');
  tmp.innerHTML = viewList();
  document.getElementById('list').replaceWith(tmp.querySelector('#list'));
});

render();
</script>
</body>
</html>
